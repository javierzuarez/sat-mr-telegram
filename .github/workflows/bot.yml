name: Bot SAT-MR (cada minuto)

on:
  schedule:
    # GitHub permite minimo 5 min por cron; se escalonan 5 crones
    # para revisar aproximadamente cada minuto.
    - cron: '0-59/5 * * * *'
    - cron: '1-59/5 * * * *'
    - cron: '2-59/5 * * * *'
    - cron: '3-59/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

# Evita que dos ejecuciones se pisen al leer/guardar el offset.
concurrency:
  group: bot-sat-mr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Procesar mensajes de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          AUTO_ALERTAS: '1'
        run: python bot.py --once

      - name: Guardar el estado del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offset.txt usuarios.json estado_zonas.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: guarda estado [skip ci]"
            git push
          else
            echo "Sin cambios de estado."
          fi
